name: Bug report
description: Report something that is not working in AntEk Launcher.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.
        **Do not report security issues here** — see the Security tab instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I am using the latest release.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: input
    id: version
    attributes:
      label: AntEk version
      description: Shown in the launcher title bar or Windows Settings.
      placeholder: "2.1.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: |
        Paste the relevant part of the in-app log, or attach files from
        `%APPDATA%\.antek\logs`.
      render: shell
    validations:
      required: false
